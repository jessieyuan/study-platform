<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>语法小黑板 · 自选复习（原型 v1）</title>
<style>
:root{
  --ink:#3d3630; --paper:#fffdf6; --bg:#f6efdd;
  --red:#e74c3c; --blue:#2980b9; --green:#27ae60; --orange:#e67e22; --purple:#8e44ad; --gold:#f1c40f;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  background-image:
    repeating-linear-gradient(0deg, rgba(0,0,0,.035) 0 1px, transparent 1px 30px),
    repeating-linear-gradient(90deg, rgba(0,0,0,.028) 0 1px, transparent 1px 30px);
  color:var(--ink);
  font-family:'LXGW WenKai','KaiTi','STKaiti','楷体','Segoe UI',serif;
  font-size:17px; user-select:none;
}
.en{font-family:'Comic Sans MS','Comic Neue',cursive;}
.wrap{max-width:980px;margin:0 auto;padding:14px 16px 60px;}
/* ---------- 手绘基础件 ---------- */
.paper{
  background:var(--paper); border:2.5px solid var(--ink);
  border-radius:255px 15px 225px 15px/15px 225px 15px 255px;
  box-shadow:3px 4px 0 rgba(61,54,48,.18); padding:14px 18px;
}
.paper.alt{border-radius:15px 255px 15px 225px/225px 15px 255px 15px;}
.btn{
  display:inline-block; background:var(--paper); border:2.5px solid var(--ink);
  border-radius:225px 12px 255px 12px/12px 255px 12px 225px;
  padding:8px 18px; font-size:17px; cursor:pointer; font-family:inherit; color:var(--ink);
  box-shadow:2px 3px 0 rgba(61,54,48,.2); transition:.12s;
}
.btn:hover{transform:translate(-1px,-1px) rotate(-.5deg); box-shadow:3px 4px 0 rgba(61,54,48,.25);}
.btn:active{transform:translate(1px,2px); box-shadow:0 0 0;}
.btn.primary{background:#ffe3b3; border-color:#b05e00; color:#7a4a00; font-weight:bold;}
.btn.big{font-size:20px; padding:12px 26px;}
.btn.small{font-size:14px; padding:4px 12px;}
.btn:disabled{opacity:.45; cursor:not-allowed; transform:none;}
/* ---------- 头部 ---------- */
.hdr{position:sticky; top:0; z-index:50; background:rgba(246,239,221,.94);
  border-bottom:2px dashed rgba(61,54,48,.25); padding:8px 0; margin-bottom:14px;}
.hdr .row{max-width:980px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:0 16px;flex-wrap:wrap;}
.logo{font-size:26px; font-weight:bold; letter-spacing:2px;}
.logo .chalk{color:var(--orange);}
.sub{font-size:13px; opacity:.7;}
.spacer{flex:1;}
.stars-badge{font-size:18px; color:#b7950b; white-space:nowrap;}
/* ---------- 模块库 ---------- */
.tabs{display:flex; gap:8px; margin:12px 0; flex-wrap:wrap;}
.tab{padding:6px 16px; border:2px solid var(--ink); border-radius:180px 10px 190px 10px/10px 190px 10px 180px;
  cursor:pointer; background:var(--paper); font-size:16px;}
.tab.on{background:#ffd9a8; font-weight:bold; box-shadow:2px 2px 0 rgba(61,54,48,.2);}
.search{width:100%; max-width:420px; padding:9px 14px; font-size:17px; font-family:inherit;
  border:2.5px solid var(--ink); border-radius:225px 12px 255px 12px/12px 255px 12px 225px; background:var(--paper);}
.grid{display:flex; flex-wrap:wrap; gap:14px; margin-top:14px;}
.mcard{width:215px; position:relative; cursor:pointer; transition:.15s;}
.mcard:hover{transform:translateY(-3px) rotate(-.6deg);}
.mcard.off{opacity:.5; cursor:not-allowed;}
.mcard .mid{display:inline-block; border:2px solid var(--ink); border-radius:50% 45% 55% 48%;
  padding:2px 10px; font-weight:bold; background:#fff3d6; margin-bottom:6px;}
.mcard .mname{font-size:19px; font-weight:bold; margin:2px 0;}
.mcard .mdesc{font-size:13px; opacity:.75; line-height:1.4; min-height:36px;}
.mcard .mstate{margin-top:8px; font-size:14px;}
.mstate .st-no{color:#8a7f70;} .mstate .st-ok{color:#b7950b; font-weight:bold;}
.mstate .st-ready{color:var(--green); font-size:12px; margin-left:6px;}
/* ---------- 模块页 ---------- */
.mhead{display:flex; align-items:center; gap:12px; margin:16px 0 6px; flex-wrap:wrap;}
.mtitle{font-size:30px; font-weight:bold;}
.statestamp{border:3px solid #8a7f70; color:#8a7f70; border-radius:12px 4px 14px 5px/5px 14px 4px 12px;
  padding:2px 12px; transform:rotate(-4deg); font-size:15px; background:rgba(255,255,255,.6);}
.statestamp.ok{border-color:#b7950b; color:#b7950b; border-style:double; border-width:4px;}
.cta-row{display:flex; gap:12px; flex-wrap:wrap; margin:14px 0;}
/* ---------- 思维导图 ---------- */
.map-wrap{overflow:auto; position:relative; border:2px dashed rgba(61,54,48,.3);
  border-radius:18px 6px 20px 8px/8px 20px 6px 18px; background:rgba(255,253,246,.7); padding:10px; max-height:70vh;}
.map{position:relative; padding:12px 26px 20px 12px; transform-origin:0 0; min-width:760px;}
.map .rootnode{position:absolute; left:12px; top:50%; transform:translateY(-50%) rotate(-1deg);
  font-size:22px; font-weight:bold; padding:12px 18px; background:#ffe9c2; border:3px solid var(--ink);
  border-radius:255px 18px 225px 18px/18px 225px 18px 255px; box-shadow:3px 4px 0 rgba(61,54,48,.2); z-index:2;}
.branches{margin-left:250px; display:flex; flex-direction:column; gap:20px; padding:6px 0;}
.brow{display:flex; align-items:center; gap:0;}
.bnode{min-width:130px; text-align:center; font-size:17px; font-weight:bold; padding:6px 12px;
  border:2.5px solid; background:#fff; border-radius:180px 12px 190px 12px/12px 190px 12px 180px; z-index:2; position:relative;}
.leaves{margin-left:26px; display:flex; flex-direction:column; gap:6px;}
.leaf{font-size:15px; background:#fff; border:1.8px solid rgba(61,54,48,.75);
  border-radius:140px 10px 150px 10px/10px 150px 10px 140px; padding:3px 12px; position:relative; z-index:2; width:fit-content;}
.leaf .exen{font-family:'Comic Sans MS','Comic Neue',cursive; font-size:14px; margin-left:6px; cursor:pointer; color:#1d6fa5;}
.leaf .exzh{font-size:12px; opacity:.65; margin-left:4px;}
.starnode{background:#fff3ce !important; font-size:17px !important; border-width:3px !important; box-shadow:2px 3px 0 rgba(193,57,43,.25);}
.brow.hl .bnode{animation:hlblink 1s infinite alternate;}
.brow.hl .leaf{border-color:#c0392b; color:#7a1f14;}
@keyframes hlblink{from{box-shadow:0 0 0 4px rgba(243,156,18,.4);}to{box-shadow:0 0 0 9px rgba(243,156,18,.75);}}
.mapsvg{position:absolute; left:0; top:0; pointer-events:none; z-index:1;}
.zoomctl{display:flex; gap:8px; margin:8px 0;}
/* ---------- 题目卡 ---------- */
.qcard{margin-top:14px; position:relative;}
.qmeta{display:flex; align-items:center; gap:10px; flex-wrap:wrap; font-size:14px; opacity:.95;}
.chip{padding:2px 10px; border:2px solid; border-radius:120px 8px 130px 8px/8px 130px 8px 120px; font-size:13px; font-weight:bold;}
.chip.ann{border-color:var(--red); color:var(--red); background:#fdeceb;}
.chip.ansf{border-color:var(--blue); color:var(--blue); background:#eaf3fa;}
.chip.build{border-color:var(--purple); color:var(--purple); background:#f4ecf9;}
.chip.type{border-color:#8a7f70; color:#5f574d; background:#f3efe6;}
.banner{margin:10px 0 4px; font-size:19px; font-weight:bold; color:#6b4a12;}
.banner .hand{color:var(--orange);}
/* 句子区 */
.sent-box{position:relative; background:#fff; border:2.5px solid var(--ink);
  border-radius:225px 14px 255px 14px/14px 255px 14px 225px; padding:48px 22px 56px; margin:10px 0; min-height:110px;}
.sent-line{line-height:2.1; font-size:25px; text-align:center;}
.word{display:inline-block; padding:0 6px; margin:0 2px; cursor:pointer; border-radius:9px 3px 11px 4px;
  border:2px solid transparent; transition:.12s; font-family:'Comic Sans MS','Comic Neue',cursive;}
.word:hover{background:rgba(243,156,18,.15);}
.word.sel{background:#ffe9a8; border-color:var(--orange); border-style:dashed;}
.word.locked{cursor:default;}
.word.locked.c-主语{background:#fde3e0;} .word.locked.c-谓语{background:#dceefb;} .word.locked.c-宾语{background:#dff3e4;}
.word.locked.c-标志词{background:#fdebd3;} .word.locked.c-疑问词{background:#eddcf5;}
.word.locked.c-be动词{background:#dceefb;} .word.locked.c-表语{background:#d9f4ef;}
.word.locked.c-宾格{background:#eddcf5;} .word.locked.c-数量{background:#fdebd3;} .word.locked.c-频度副词{background:#fdebd3;}
.word.locked.reusable{cursor:pointer;} .word.locked.reusable.sel{background:#ffe9a8; border-color:var(--orange); border-style:dashed;}
.word.shake{animation:wshake .5s;}
@keyframes wshake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px) rotate(-2deg)}40%{transform:translateX(6px)}60%{transform:translateX(-4px) rotate(2deg)}80%{transform:translateX(4px)}}
.word.glow{animation:wglow 1s infinite;}
@keyframes wglow{0%,100%{background:#ffe9a8;}50%{box-shadow:0 0 0 8px rgba(243,156,18,.45); background:#ffd27f;}}
.word.blank{min-width:88px; border-bottom:3px dashed #8a7f70; color:#8a7f70; text-align:center; padding:0 8px;}
.word.blank .hintw{font-size:12px; opacity:.7; vertical-align:sub; font-family:inherit;}
.chipin{display:inline-block; background:#fff3d6; border:2px solid #b05e00; color:#7a4a00;
  border-radius:10px 4px 12px 5px/5px 12px 4px 10px; padding:0 8px; margin:0 2px; cursor:pointer;}
.chipin.pending{border-style:dashed; border-color:var(--purple); background:#f6effc;}
.slot{display:inline-block; min-width:76px; min-height:38px; margin:3px; border-bottom:3px dashed #8a7f70;
  border-radius:6px; vertical-align:middle;}
.slot .chipin{margin:1px;}
.slot.sel{background:#ffe9a8; outline:2px dashed #e67e22; outline-offset:1px;}
.slot.shake{animation:wshake .5s;}
.slot.glow{animation:wglow 1s infinite;}
.slot.locked .chipin{border-style:solid;}
.slot.locked.c-主语 .chipin{background:#fde3e0; border-color:#e74c3c;}
.slot.locked.c-谓语 .chipin{background:#dceefb; border-color:#2980b9;}
.slot.locked.c-宾语 .chipin{background:#dff3e4; border-color:#27ae60;}
.slot.locked.c-标志词 .chipin{background:#fdebd3; border-color:#e67e22;}
.slot.locked.c-疑问词 .chipin{background:#eddcf5; border-color:#8e44ad;}
.slot.locked.c-be动词 .chipin{background:#dceefb; border-color:#2980b9;}
.slot.locked.c-表语 .chipin{background:#d9f4ef; border-color:#16a085;}
.slot.locked.c-宾格 .chipin{background:#eddcf5; border-color:#8e44ad;}
.slot.locked.c-数量 .chipin{background:#fdebd3; border-color:#e67e22;}
.slot.locked.c-频度副词 .chipin{background:#fdebd3; border-color:#e67e22;}
.slot.locked.reusable{cursor:pointer;}
.bsvg{position:absolute; left:0; top:0; pointer-events:none; overflow:visible;}
.stamp-slot{position:absolute; right:10px; top:2px; z-index:5;}
.stamp{display:inline-block; border:3px solid var(--purple); color:var(--purple); font-weight:bold;
  border-radius:14px 5px 16px 6px/6px 16px 5px 14px; padding:2px 12px; font-size:17px;
  background:rgba(255,255,255,.75); transform:rotate(-7deg); animation:stampin .55s cubic-bezier(.2,.85,.2,1); margin-left:6px;
  box-shadow:0 6px 12px rgba(61,54,48,.18);}
@keyframes stampin{
  0%{transform:scale(3.1) rotate(-24deg); opacity:0; filter:blur(2px);}
  55%{transform:scale(.84) rotate(-4deg); opacity:1; filter:blur(0);}
  75%{transform:scale(1.08) rotate(-9deg);}
  100%{transform:scale(1) rotate(-7deg);}
}
.stamp-hit{animation:stamphit .38s;}
@keyframes stamphit{0%,100%{transform:none;}35%{transform:translateY(4px) scale(.995);}65%{transform:translateY(-1px) scale(1.002);}}
/* 标注盘 */
.palette{margin:12px 0 4px; padding:10px 12px; background:#fff8e4; border:2px dashed #c9a227;
  border-radius:14px 6px 16px 7px/7px 16px 6px 14px;}
.palette .ptip{font-size:15px; margin-bottom:8px; color:#6b4a12;}
.label-btn{margin:4px 6px 4px 0; color:#fff; font-weight:bold; border:none;}
.lbtn-主语{background:var(--red);} .lbtn-谓语{background:var(--blue);} .lbtn-宾语{background:var(--green);}
.lbtn-标志词{background:var(--orange);} .lbtn-疑问词{background:var(--purple);}
.stamprow{display:flex; gap:10px; flex-wrap:wrap; margin:10px 0;}
.stampopt{font-size:16px; padding:6px 14px; color:var(--purple); border-color:var(--purple); background:#f8f2fd;}
.stampopt:hover{background:#efe1fa;}
/* 作答区 */
.anszone{margin:8px 0;}
.cards{display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin:10px 0;}
.cardw{font-size:20px; padding:6px 16px; background:#fff; font-family:'Comic Sans MS','Comic Neue',cursive;}
.cardw:disabled{opacity:.35; text-decoration:line-through;}
.opt{font-size:19px; font-family:'Comic Sans MS','Comic Neue',cursive; padding:6px 18px;}
.opt.on{background:#ffe3b3; border-color:#b05e00; font-weight:bold;}
.judgebtns{display:flex; gap:16px; justify-content:center; margin:10px 0;}
.judgebtns .btn{font-size:24px; padding:10px 30px;}
.actionrow{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-top:8px; min-height:44px;}
.hintline{font-size:14px; opacity:.75;}
/* 便签 */
.note{background:#fff7b0; border:2px solid #c9a227; border-radius:6px 16px 8px 18px/16px 6px 18px 8px;
  padding:10px 14px; margin:10px 0; transform:rotate(-1deg); box-shadow:2px 3px 0 rgba(201,162,39,.3); font-size:16px;}
/* 反馈 */
.fb{margin:12px 0; padding:10px 14px; font-size:16px; animation:fadeup .4s;}
@keyframes fadeup{from{opacity:0; transform:translateY(10px);}to{opacity:1; transform:none;}}
.fb.ok{background:#e8f7ec; border:2.5px solid var(--green); border-radius:180px 12px 190px 12px/12px 190px 12px 180px;}
.fb.bad{background:#fdeceb; border:2.5px solid var(--red); border-radius:12px 180px 12px 190px/190px 12px 180px 12px;}
.fb .tag{display:inline-block; background:#fff; border:1.5px solid currentColor; border-radius:100px 6px 100px 6px/6px 100px 6px 100px;
  padding:1px 10px; font-size:13px; margin-right:6px;}
.bigstar{position:absolute; font-size:40px; animation:starfly 1.1s forwards; pointer-events:none; z-index:20;}
@keyframes starfly{from{opacity:1; transform:translateY(0) scale(.6) rotate(0deg);}to{opacity:0; transform:translateY(-90px) scale(1.4) rotate(30deg);}}
/* 结果页 */
.endcard{text-align:center; padding:24px;}
.endcard .big{font-size:30px; font-weight:bold; margin:8px 0;}
.reslist{margin:10px 0; font-size:15px; text-align:left;}
.reslist .r{padding:3px 8px; border-bottom:1px dashed rgba(61,54,48,.2);}
.mastered{border:5px double #b7950b; color:#b7950b; font-size:26px; font-weight:bold; display:inline-block;
  padding:8px 24px; transform:rotate(-5deg); border-radius:20px 8px 22px 9px/9px 22px 8px 20px; animation:stampin .5s; margin:12px; background:rgba(255,255,255,.7);}
/* 错题本 */
.wrongitem{display:flex; gap:10px; align-items:flex-start; margin:8px 0; cursor:pointer;}
.wrongitem:hover{transform:translateX(4px);}
/* toast */
.toast{position:fixed; top:64px; left:50%; transform:translateX(-50%) rotate(-1deg); z-index:100;
  background:#4a3f35; color:#fff; padding:8px 20px; border-radius:180px 12px 190px 12px/12px 190px 12px 180px;
  font-size:16px; box-shadow:2px 3px 0 rgba(0,0,0,.3); animation:fadeup .3s; max-width:80vw; text-align:center;}
/* 演示 */
.demobar{display:flex; gap:10px; margin:8px 0; align-items:center; flex-wrap:wrap;}
.says{font-size:18px; color:#6b4a12; min-height:28px; margin:6px 0;}
.backline{margin:4px 0 0;}
.sec-title{font-size:22px; font-weight:bold; margin:18px 0 8px;}
.divider{border:none; border-top:2px dashed rgba(61,54,48,.3); margin:16px 0;}
@media (max-width:640px){ .sent-line{font-size:20px;} .mcard{width:100%;} .branches{margin-left:200px;} }
</style>
</head>
<body>
<div class="hdr"><div class="row">
  <span class="logo">语法<span class="chalk">小</span>黑板</span>
  <span class="sub">小学语法 · 自选复习 原型 v1</span>
  <span class="spacer"></span>
  <span class="stars-badge" id="starBadge">★ 0</span>
  <button class="btn small" id="soundBtn">🔊</button>
  <button class="btn small" id="wrongBtn">错题本</button>
  <button class="btn small" id="homeBtn">🏠 首页</button>
  <button class="btn small" id="resetBtn">🗑</button>
</div></div>
<div class="wrap" id="app"></div>
<div id="toastHost"></div>

<script>
/* =============== 数据：模块库 =============== */
const MODULES=[
{id:'T1',cat:'时态',name:'一般现在时',desc:'习惯与事实 · 三单 s/es',alias:['一般现在','三单','does'],ready:true},
 {id:'T2',cat:'时态',name:'现在进行时',desc:'正在发生 · be + V-ing',alias:['进行时','ing','正在','be doing'],ready:true},
 {id:'T3',cat:'时态',name:'一般将来时',desc:'will / be going to',alias:['将来','will','going']},
 {id:'T4',cat:'时态',name:'一般过去时',desc:'ed 与不规则动词',alias:['过去','ed','went','did']},
 {id:'T5',cat:'时态',name:'四时态辨析',desc:'同句切换 · 标志词辨析',alias:['综合','辨析','切换','四种时态']},
 {id:'T6',cat:'时态',name:'现在完成时',desc:'have/has + 过去分词（认识）',alias:['完成','have been']},
 {id:'V1',cat:'词法',name:'be 动词',desc:'am / is / are',alias:['be','am','is','are'],ready:true},
 {id:'V2',cat:'词法',name:'情态动词 can',desc:'能力与请求 · Can you…?',alias:['can','能','会']},
 {id:'V3',cat:'词法',name:'情态动词 must',desc:'must / mustn\u2019t 规则与义务',alias:['must','必须','mustn','禁止']},
 {id:'V4',cat:'词法',name:'情态动词 should',desc:'建议与劝告',alias:['should','应该']},
 {id:'P1',cat:'词法',name:'人称代词',desc:'主格 / 宾格',alias:['代词','he','she','they'],ready:true},
 {id:'P2',cat:'词法',name:'物主代词',desc:'形容词性 / 名词性',alias:['my','mine','whose']},
 {id:'P3',cat:'词法',name:'指示代词',desc:'this / that / these / those',alias:['this','that','these']},
 {id:'N1',cat:'词法',name:'名词复数',desc:'s / es / ies + 不规则',alias:['复数','plural','s'],ready:true},
 {id:'N2',cat:'词法',name:'可数与不可数',desc:'much / many',alias:['不可数','much','many']},
 {id:'N3',cat:'词法',name:'名词所有格',desc:'\u2019s / of',alias:['所有格']},
 {id:'G1',cat:'词法',name:'冠词',desc:'a / an / the',alias:['冠词','a','an','the']},
 {id:'D1',cat:'词法',name:'基数词与序数词',desc:'数词、月份、日期',alias:['数词','序数','月份'],ready:true},
 {id:'D2',cat:'词法',name:'时间与日期表达',desc:'What time / When',alias:['时间','what time','when']},
 {id:'E1',cat:'词法',name:'形容词的用法',desc:'位置与修饰',alias:['形容词','adjective']},
 {id:'E2',cat:'词法',name:'频度与 How often',desc:'always… / How often do you…?',alias:['how often','频度','经常','always','usually'],ready:true},
 {id:'E3',cat:'词法',name:'比较级与最高级',desc:'-er / -est + 不规则',alias:['比较级','最高级','er','est']},
 {id:'F1',cat:'词法',name:'时间介词',desc:'in / on / at',alias:['介词','in on at']},
 {id:'F2',cat:'词法',name:'方位介词',desc:'in/on/under/behind',alias:['方位','under','behind']},
 {id:'J1',cat:'词法',name:'并列连词',desc:'and / but / or',alias:['连词','and','but','or']},
 {id:'S1',cat:'句法',name:'陈述句与否定句',desc:'肯否转换',alias:['陈述','否定','not']},
 {id:'S2',cat:'句法',name:'一般疑问句',desc:'be / 情态 / do 三类',alias:['一般疑问','do you','is he']},
 {id:'S3',cat:'句法',name:'特殊疑问句',desc:'wh 疑问词体系',alias:['特殊疑问','wh','what','where','why']},
 {id:'S4',cat:'句法',name:'祈使句',desc:'Let\u2019s… / 动词开头',alias:['祈使','let']},
 {id:'S5',cat:'句法',name:'感叹句',desc:'What a…! / How…!',alias:['感叹','what a','how']},
 {id:'S6',cat:'句法',name:'there be 句型',desc:'there is/are + was/were',alias:['there','有','there be']},
 {id:'S7',cat:'句法',name:'some 与 any',desc:'肯否疑搭配',alias:['some','any']},

/* =============== 手绘 SVG =============== */
function J(){return (Math.random()-0.5)*3;}
function makeSvg(w,h){const svg=document.createElementNS('http://www.w3.org/2000/svg','svg'); svg.setAttribute('class','bsvg'); svg.setAttribute('width',Math.max(w,10)); svg.setAttribute('height',Math.max(h,10)); return svg;}
function svgPath(svg,d,color,width,dashed){
  const p=document.createElementNS('http://www.w3.org/2000/svg','path');
  p.setAttribute('d',d); p.setAttribute('stroke',color); p.setAttribute('fill','none');
  p.setAttribute('stroke-width',width||2.4); p.setAttribute('stroke-linecap','round');
  if(dashed)p.setAttribute('stroke-dasharray','7 5');
  svg.appendChild(p);
  try{const len=p.getTotalLength();
    p.style.strokeDasharray=len; p.style.strokeDashoffset=len;
    requestAnimationFrame(function(){p.style.transition='stroke-dashoffset .5s'; p.style.strokeDashoffset='0';});
  }catch(e){}
  return p;
}
function svgText(svg,x,y,txt,color){
  const t=document.createElementNS('http://www.w3.org/2000/svg','text');
  t.setAttribute('x',x+J()); t.setAttribute('y',y+J()); t.setAttribute('fill',color);
  t.setAttribute('font-size','15'); t.setAttribute('text-anchor','middle');
  t.setAttribute('font-family','KaiTi,STKaiti,serif'); t.setAttribute('font-weight','bold');
  t.textContent=txt; svg.appendChild(t); return t;
}
function bracePath(x1,x2,y,h){
  const mid=(x1+x2)/2, tip=(h>0?6:-6);
  return 'M '+(x1+J())+' '+(y+J())+' Q '+(x1+J())+' '+(y+h+J())+' '+(mid-9+J())+' '+(y+h+J())+
         ' Q '+(mid+J())+' '+(y+h+tip+J())+' '+(mid+9+J())+' '+(y+h+J())+
         ' Q '+(x2+J())+' '+(y+h+J())+' '+(x2+J())+' '+(y+J());
}
/* 在 sent-box 内为词区间画括号 */
function drawBrace(box,svg,words,els,label,color,dashed){
  const valid=els.filter(Boolean); if(!valid.length)return;
  /* 按索引连续性分段：疑问句的谓语（be 提前）被主语隔开时，各画一段括号 */
  const runs=[]; let cur=[];
  valid.forEach(function(e){
    const raw=e.dataset?e.dataset.i:undefined;
    const i=(raw!==undefined)?parseInt(raw,10):NaN;
    if(cur.length){
      const praw=cur[cur.length-1].dataset?cur[cur.length-1].dataset.i:undefined;
      const pi=(praw!==undefined)?parseInt(praw,10):NaN;
      if(!isNaN(i)&&!isNaN(pi)&&i-pi!==1){runs.push(cur); cur=[e]; return;}
    }
    cur.push(e);
  });
  if(cur.length)runs.push(cur);
  const st=labelStyle(label); const above=!!st.above;
  runs.forEach(function(run){
    const first=run[0], last=run[run.length-1];
    let x1=first.offsetLeft, x2=last.offsetLeft+last.offsetWidth;
    let wordTop=Infinity, wordBot=-Infinity;
    run.forEach(function(e){x1=Math.min(x1,e.offsetLeft); x2=Math.max(x2,e.offsetLeft+e.offsetWidth); wordTop=Math.min(wordTop,e.offsetTop); wordBot=Math.max(wordBot,e.offsetTop+e.offsetHeight);});
    let y,h;
    if(above){ y=wordTop-10; h=-13; }
    else { y=wordBot+6; h=13; }
    svgPath(svg,bracePath(x1,x2,y,h),color,2.6,dashed);
    const mid=(x1+x2)/2;
    const ly=above? y+h-8 : y+h+20;
    svgText(svg,mid,ly,label+(dashed?'（老师标）':''),color);
  });
  if(svg.parentNode!==box)box.appendChild(svg);
  svg.setAttribute('width',box.offsetWidth); svg.setAttribute('height',box.offsetHeight+40);
}

/* =============== 抽题 =============== */
function drawQuestions(pool,n,coverage){
  const unseen=pool.filter(function(q){return !state.seen[q.id];});
  const pick=[];
  if(coverage){
    const covered={};
    ['judge','choice','fill','build'].forEach(function(t){
      const arr=shuffle(unseen.filter(function(q){return q.type===t;}));
      if(!arr.length)return;
      /* 优先选还没覆盖到的句型 */
      let best=arr.filter(function(q){return q.stype&&!covered[q.stype];})[0];
      if(!best)best=arr[0];
      pick.push(best); if(best.stype)covered[best.stype]=true;
    });
    ['陈述句','一般疑问句','特殊疑问句'].forEach(function(st){
      if(covered[st]||pick.length>=n)return;
      const arr=shuffle(unseen.filter(function(q){return q.stype===st&&pick.indexOf(q)<0;}));
      if(arr.length){pick.push(arr[0]); covered[st]=true;}
    });
  }
  shuffle(unseen).forEach(function(q){ if(pick.length<n && pick.indexOf(q)<0) pick.push(q); });
  if(pick.length<n){
    shuffle(pool.filter(function(q){return state.wrong[q.id]&&pick.indexOf(q)<0;})).slice(0,n-pick.length).forEach(function(q){pick.push(q);});
  }
  if(pick.length<n){
    shuffle(pool.filter(function(q){return pick.indexOf(q)<0;})).slice(0,n-pick.length).forEach(function(q){pick.push(q);});
  }
  return pick.sort(function(a,b){return a.difficulty-b.difficulty;});
}

    skip.style.display='none'; replay.style.display='inline-block'; go.style.display='inline-block';

    says.textContent='看老师怎么「读题」——';

        } else if(step.action==='stamp'){
          says.textContent='🖨 '+step.say; speakZh(step.say);
          stampHit();
          stampSlot.appendChild(el('div','stamp','⏱ '+step.value));
        } else if(step.action==='answer'){

          stampHit();

          stampSlot.appendChild(s);
          timers.push(setTimeout(finish,900));
        }
      },t));
      t+=1800;
    });
  }
  skip.onclick=finish; replay.onclick=play; go.onclick=onDone;
  requestAnimationFrame(play);
}

/* =============== 核心：题目渲染 =============== */
function renderQuestionScreen(q,mode,ctx){
  const app=document.getElementById('app'); app.innerHTML='';
  const isBuild=q.type==='build';
  /* 流程序列 */
  let flow;
  if(ctx.kind==='quiz'){ flow=['answer','grade']; }
  else if(ctx.kind==='wrong'){ flow=['annotate','stamp','reveal','answer','grade']; }
  else if(isBuild){ flow=['answer','annotate','stamp','grade']; }
  else if(mode==='annotate'){ flow=['annotate','stamp','answer','grade']; }
  else { flow=['answer','annotate','stamp','conflict','grade']; }
  let phaseIdx=0;
  const annotations={}; const attempts={};
  let stampVal=null, stampWrongHinted=false, answer=null, revised=false, committed=false, graded=false;

  const card=el('div','paper qcard'); app.appendChild(card);
  /* meta */
  const meta=el('div','qmeta');
  const typeName=TYPE_NAME[q.type]+' '+'★'.repeat(q.difficulty)+'☆'.repeat(3-q.difficulty);
  meta.appendChild(el('span','chip type',typeName));
  if(ctx.kind==='practice'){
    const modeChip=el('span','chip '+(isBuild?'build':(mode==='annotate'?'ann':'ansf')), isBuild?'先组句 · 后标注':(mode==='annotate'?'先标注':'先作答 · 后自查'));
    meta.appendChild(modeChip);
    meta.appendChild(el('span','','第 '+(session.idx+1)+' / '+session.questions.length+' 题'));
  } else if(ctx.kind==='quiz'){
    meta.appendChild(el('span','chip ansf','小测 · 直接作答'));
    meta.appendChild(el('span','','第 '+(session.idx+1)+' / '+session.questions.length+' 题'));
  } else {
    meta.appendChild(el('span','chip ann','错题回看 · 先标注'));
  }
  card.appendChild(meta);
  const back=el('button','btn small','退出'); back.onclick=function(){renderModule(session&&session.mid?session.mid:'T2');};
  meta.appendChild(back);
  const banner=el('div','banner'); card.appendChild(banner);
  function setBanner(t){banner.innerHTML=t;}
  const STEM={judge:'📝 判断题：下面这句话说得<b>对</b>还是<b>错</b>？',choice:'📝 选择题：横线里应该填哪一个？',fill:'📝 填空题：把正确的词填进横线里',build:'📝 组句题：把词卡排成一句通顺的话'};
  card.appendChild(el('div','says',STEM[q.type]));

  /* 句子区 */
  const box=el('div','sent-box'); const line=el('div','sent-line');
  const words=[]; const slotEls=[];
  let blankEl=null;
  if(isBuild){
    q.cards.forEach(function(c,i){const s=el('span','slot'); s.dataset.i=i; slotEls.push(s); line.appendChild(s);});
    /* 结尾标点（? . !）不在词卡里，直接亮出来 */
    for(let k=q.cards.length;k<q.built.length;k++){
      const p=el('span','word',q.built[k]); p.style.cursor='default'; p.style.border='none'; words.push(p); line.appendChild(p);
    }
  } else {
    q.sentence.forEach(function(t,i){
      if(t==='____'){
        const w=el('span','word blank','____'+(q.hint?'<span class="hintw">('+q.hint+')</span>':''));
        w.dataset.i=i; blankEl=w; words.push(w); line.appendChild(w);
      } else {
        const w=el('span','word',t); w.dataset.i=i; words.push(w); line.appendChild(w);
      }
    });
  }
  box.appendChild(line);
  const stampSlot=el('div','stamp-slot'); box.appendChild(stampSlot);
  const svg=makeSvg(box.offsetWidth,box.offsetHeight);
  const snd=el('button','btn small','🔊 读题');
  snd.style.position='absolute'; snd.style.left='10px'; snd.style.top='2px';
  snd.onclick=function(){speak((q.sentence?q.sentence:q.built).filter(function(w){return w!=='____';}).join(' '));};
  box.appendChild(snd);
  card.appendChild(box);

  /* 词点击（标注阶段） */
  function wordEls(){return isBuild?slotEls:words;}
  function isReusable(w){
    if(currentPhase()!=='annotate')return false;
    const remaining=remainingLabels();
    if(!remaining.length)return false;
    if(!isBuild){
      const idx=parseInt(w.dataset.i,10);
      return remaining.some(function(l){return q.annotation[l].indexOf(idx)>=0;});
    }
    const text=w.textContent.trim().toLowerCase();
    return remaining.some(function(l){
      return q.annotation[l].some(function(i){return String(q.built[i]).trim().toLowerCase()===text;});
    });
  }
  function refreshReusable(){
    wordEls().forEach(function(w){
      w.classList.toggle('reusable',w.classList.contains('locked')&&isReusable(w));
    });
  }
  function wordClick(e){
    if(currentPhase()!=='annotate')return;
    const w=e.currentTarget;
    if(w.classList.contains('locked')&&!isReusable(w))return;
    if(w.classList.contains('sel'))w.classList.remove('sel');
    else w.classList.add('sel');
    updatePalette();
  }
  wordEls().forEach(function(w){w.addEventListener('click',wordClick);});

  /* 标注盘 */
  const labels=Object.keys(q.annotation).filter(function(k){return k!=='tense'&&k!=='tenseOptions';});
  const palette=el('div','palette'); card.appendChild(palette);
  function remainingLabels(){return labels.filter(function(l){return !(l in annotations);});}
  function selEls(){return wordEls().filter(function(w){return w.classList.contains('sel');});}
  function updatePalette(){
    palette.innerHTML='';
    const rem=remainingLabels();
    if(currentPhase()!=='annotate'){palette.style.display='none'; return;}
    palette.style.display='block';
    const selCount=selEls().length;
    const tip=el('div','ptip', selCount?('已选 '+selCount+' 个词，它是——'):'✏️ 点句子里的单词，然后选它是什么成分（'+rem.length+' 个待标）');
    palette.appendChild(tip);
    rem.forEach(function(l){
      const st=labelStyle(l);
      const b=el('button','btn label-btn lbtn-'+l,l+'·'+st.hint);
      b.style.background=st.c;
      b.onclick=function(){pickLabel(l);};
      palette.appendChild(b);
    });
    if(selCount){
      const c=el('button','btn small','取消选择');
      c.onclick=function(){wordEls().forEach(function(w){w.classList.remove('sel');}); updatePalette();};
      palette.appendChild(c);
    }
    /* 两次失败后给「看正确标注」 */
    Object.keys(attempts).forEach(function(l){
      if(attempts[l]>=2 && !(l in annotations)){
        const b=el('button','btn small','看看「'+l+'」的正确标注');
        b.onclick=function(){autoAnnotate(l);};
        palette.appendChild(b);
      }
    });
  }
  function spanCorrect(l,els){
    if(isBuild){
      const target=q.annotation[l].map(function(i){return q.built[i];}).join(' ').toLowerCase().replace(/[.!?,]/g,'').trim();
      const got=els.map(function(e){return e.textContent.trim();}).join(' ').toLowerCase().replace(/[.!?,]/g,'').trim();
      return target===got;
    }
    const target=q.annotation[l].slice().sort().join(',');
    const got=els.map(function(e){return parseInt(e.dataset.i,10);}).sort().join(',');
    return target===got;
  }
  function autoAnnotate(l){
    const st=labelStyle(l);
    let els;
    if(isBuild){ els=q.annotation[l].map(function(i){return slotEls[i];}); }
    else { els=q.annotation[l].map(function(i){return words[i];}); }
    els.forEach(function(e){e.classList.remove('sel'); e.classList.add('locked','c-'+l);});
    annotations[l]=true;
    drawBrace(box,svg,words,els,l,st.c,true);
    refreshReusable();
    updatePalette();
    if(!remainingLabels().length)advance();
  }
  function pickLabel(l){
    const sel=selEls();
    if(!sel.length){toast('先点单词，再选标签哦'); return;}
    const st=labelStyle(l);
    if(spanCorrect(l,sel)){
      sel.forEach(function(e){e.classList.remove('sel'); e.classList.add('locked','c-'+l);});
      annotations[l]=true;
      drawBrace(box,svg,words,sel,l,st.c,false);
      refreshReusable();
      toast('✓ 「'+l+'」标对了！');
      updatePalette();
      if(!remainingLabels().length)advance();
    } else {
      attempts[l]=(attempts[l]||0)+1;
      sel.forEach(function(e){e.classList.add('shake'); setTimeout(function(){e.classList.remove('shake','sel');},520);});
      if(attempts[l]>=2){
        toast('再读读这句话～正确范围亮起来了');
        let els;
        if(isBuild){els=q.annotation[l].map(function(i){return slotEls[i];});}
        else{els=q.annotation[l].map(function(i){return words[i];});}
        els.forEach(function(e){e.classList.add('glow'); setTimeout(function(){e.classList.remove('glow');},1800);});
      } else {
        toast('再读读这句话～');
      }
      updatePalette();
    }
  }

  /* 盖章 */
  const stampRow=el('div','stamprow'); card.appendChild(stampRow); stampRow.style.display='none';
  let stampPicks=0;
  function showStampRow(){
    stampRow.style.display='flex'; stampRow.innerHTML='';
    const spec=STAMP_SPECS[q.id.slice(0,2)]||{tip:'🖨 判断时态，盖个章：',options:q.annotation.tenseOptions||DEFAULT_TENSE_OPTIONS};
    stampRow.appendChild(el('span','ptip','🖨 '+spec.tip));
    const opts=spec.options;
    opts.forEach(function(opt){
      const b=el('button','btn stampopt',opt.replace('时',''));
      b.onclick=function(){pickStamp(opt,b);};
      stampRow.appendChild(b);
    });
  }
  let stampDone=false;
  function pickStamp(opt,btn){
    if(stampDone){toast('已经盖过章啦，继续往下'); return;}
    stampPicks++;
    stampVal=opt;
    stampSlot.innerHTML='';
    card.classList.remove('stamp-hit'); void card.offsetWidth; card.classList.add('stamp-hit');
    stampSlot.appendChild(el('div','stamp','⏱ '+opt));
    const correct=opt===q.annotation.tense;
    if(!correct){
      if(!stampWrongHinted){stampWrongHinted=true; toast('章好像不太对——再看看橙色的标志词括号👆（可以再盖一次）'); return;}
      toast('好，就先这样，继续');
    }
    stampDone=true;
    stampRow.querySelectorAll('button').forEach(function(b){b.disabled=true; if(b===btn)b.style.background='#ffe3b3';});
    setTimeout(function(){stampRow.style.display='none';},700);
    advance();
  }

  /* 作答区 */
  const ansZone=el('div','anszone'); card.appendChild(ansZone);
  const actionRow=el('div','actionrow'); card.appendChild(actionRow);
  const fbZone=el('div',''); card.appendChild(fbZone);
  let placed=[]; /* fill/build 已放入的卡 */
  let chosenOpt=null; let chosenJudge=null;
  function buildAnswerUI(){
    ansZone.innerHTML=''; actionRow.innerHTML='';
    const commit=el('button','btn big primary', isBuild?'✅ 组好了':'✅ 选好了');
    commit.disabled=true; commit.id='commitBtn';
    commit.onclick=function(){commitAnswer();};
    /* 单选/判断/填满后自动提交，省一次点击；换选项会重新计时 */
    let autoCommitTimer=null;
    function armAutoCommit(delay){
      if(isBuild)return;
      if(autoCommitTimer)clearTimeout(autoCommitTimer);
      autoCommitTimer=setTimeout(function(){
        if(!committed&&document.body.contains(commit)&&!commit.disabled)commit.click();
      },delay||1300);
    }
    if(q.type==='judge'){
      ansZone.appendChild(el('div','says','👩‍🏫 当小老师：这句话说得<b>对</b>还是<b>错</b>？点完自动批改～'));
      const row=el('div','judgebtns');
      [true,false].forEach(function(v){
        const b=el('button','btn', v?'😊 对':'❌ 错');
        b.onclick=function(){chosenJudge=v; commit.disabled=false;
          row.querySelectorAll('.btn').forEach(function(x){x.classList.remove('primary');});
          b.classList.add('primary'); armAutoCommit(1200);};
        row.appendChild(b);
      });
      ansZone.appendChild(row);
    } else if(q.type==='choice'){
      const row=el('div','cards');
      q.options.forEach(function(o){
        const b=el('button','btn opt',o);
        b.onclick=function(){chosenOpt=o; commit.disabled=false;
          row.querySelectorAll('.opt').forEach(function(x){x.classList.remove('on');});
          b.classList.add('on');
          if(blankEl){blankEl.innerHTML='<span class="chipin">'+o+'</span>'; redraw();}
          armAutoCommit(1300);};
        row.appendChild(b);
      });
      ansZone.appendChild(row);
    } else if(q.type==='fill'){
      const row=el('div','cards');
      const shuffled=shuffle(q.cards);
      shuffled.forEach(function(c){
        const b=el('button','btn cardw',c);
        b.onclick=function(){
          if(placed.length>=q.answer.value.length)return;
          placed.push(c); b.disabled=true;
          renderBlank(); commit.disabled=(placed.length<q.answer.value.length); redraw();
          if(placed.length>=q.answer.value.length)armAutoCommit(1700);
        };
        b.dataset.card=c; row.appendChild(b);
      });
      ansZone.appendChild(row);
    } else if(q.type==='build'){
      const row=el('div','cards');
      shuffle(q.cards).forEach(function(c){
        const b=el('button','btn cardw',c);
        b.onclick=function(){
          if(placed.length>=q.cards.length)return;
          placed.push(c); b.disabled=true;
          renderSlots(); commit.disabled=(placed.length<q.cards.length);
        };
        b.dataset.card=c; row.appendChild(b);
      });
      ansZone.appendChild(row);
    }
    actionRow.appendChild(commit);
    let hintTxt;
    if(isBuild)hintTxt='点词卡组句：点错了点句子里的词可以退回';
    else if(q.type==='fill')hintTxt='点词卡填进空里；点已填的词可以退回';
    else if(q.type==='choice')hintTxt='点一个你认为正确的选项';
    else hintTxt='读读句子，判断对错';
    const hint=el('span','hintline',hintTxt);
    actionRow.appendChild(hint);
  }
  function renderBlank(){
    if(!blankEl)return;
    blankEl.innerHTML='';
    placed.forEach(function(c,i){
      const ch=el('span','chipin'+(committed?' pending':''),c);
      ch.onclick=function(){ if(committed)return; placed.splice(i,1);
        document.querySelectorAll('.cardw').forEach(function(b){if(b.dataset.card===c)b.disabled=false;});
        renderBlank(); $('#commitBtn').disabled=(placed.length<q.answer.value.length); redraw();};
      blankEl.appendChild(ch);
    });
    if(!placed.length)blankEl.innerHTML='____'+(q.hint?'<span class="hintw">('+q.hint+')</span>':'');
  }
  function capFirst(s){return s.charAt(0).toUpperCase()+s.slice(1);}
  function sentCase(arr){
    let out='',cap=true;
    arr.forEach(function(w){
      let t=w;
      if(cap&&/[a-z]/.test(t.charAt(0)))t=capFirst(t);
      out+=(out?' ':'')+t;
      cap=/[.!?]$/.test(t);
    });
    return out;
  }
  function renderSlots(){
    slotEls.forEach(function(s,i){
      s.innerHTML='';
      if(placed[i]!==undefined){
        let disp=placed[i];
        if(i===0||/[.!?]$/.test(String(placed[i-1])))disp=capFirst(disp);
        const ch=el('span','chipin'+(committed?' pending':''),disp);
        ch.onclick=function(){ if(committed)return;
          const c=placed.splice(i,1)[0];
          document.querySelectorAll('.cardw').forEach(function(b){if(b.dataset.card===c)b.disabled=false;});
          renderSlots(); $('#commitBtn').disabled=(placed.length<q.cards.length);};
        s.appendChild(ch);
      }
    });
  }
  function renderAnswerDisplay(){ if(q.type==='fill')renderBlank(); if(q.type==='build')renderSlots(); }
  function commitAnswer(){
    committed=true;
    if(q.type==='judge')answer={value:chosenJudge};
    else if(q.type==='choice')answer={value:chosenOpt};
    else if(q.type==='fill')answer={value:placed.slice()};
    else answer={value:placed.slice()};
    if(currentPhase()==='answer'){
      const next=flow[phaseIdx+1];
      if(next==='annotate'){
        setPhase('annotate');
        setBanner('✏️ 答案先放这儿<span class="hand">（虚线 = 待自查）</span>。现在用笔记检查：点单词、选成分');
        ansZone.style.opacity='.75';
        $('#commitBtn').style.display='none';
        renderAnswerDisplay();
      } else if(next==='grade'){ gradeNow(); }
    }
    /* 修改后二次提交（冲突自查后） */
    if(revised){ gradeNow(); }
  }
  function isCorrect(){
    if(!answer)return false;
    if(q.type==='judge'||q.type==='choice')return answer.value===q.answer.value;
    if(answer.value.length!==q.answer.value.length)return false;
    return answer.value.every(function(v,i){return v===q.answer.value[i];});
  }
  function answerText(){
    if(q.type==='judge')return q.answer.value?'对':'错';
    if(q.type==='choice')return q.answer.value;
    if(q.type==='build')return sentCase(q.built).replace(/\s+([?.!,])/g,'$1');
    return q.answer.value.join(' ');
  }

  /* 阶段机 */
  function currentPhase(){return flow[phaseIdx];}
  function setPhase(p){
    const i=flow.indexOf(p); if(i>=0)phaseIdx=i;
    if(p==='annotate'){
      setBanner('✏️ <span class="hand">先标注：</span>点单词 → 选它是什么成分');
      palette.style.display='block'; updatePalette();
      refreshReusable();
      if(!remainingLabels().length){advance(); return;}
    } else if(p==='stamp'){
      palette.style.display='none';
      setBanner('🖨 成分标完了！判断时态：<span class="hand">盖个章</span>');
      showStampRow();
    } else if(p==='answer'){
      if(ctx.kind==='wrong'){ setBanner('🔁 重做一次：这次一定对！'); }
      else if(isBuild){ setBanner('🧩 <span class="hand">先组句：</span>点词卡，把句子排好'); }
      else if(flow[flow.indexOf('answer')+1]==='annotate'){ setBanner('✍️ <span class="hand">先作答：</span>凭第一判断选，等会儿用笔记检查'); }
      else { setBanner('✍️ 现在作答！'); }
      buildAnswerUI();
    } else if(p==='reveal'){
      setBanner('💡 标注完成！看看正确答案');
      palette.style.display='none'; stampRow.style.display='none';
      const fb=el('div','fb ok');
      fb.innerHTML='正确答案：<b class="en">'+answerText()+'</b><br>'+'<span class="hintline">'+q.explain+'</span>';
      fbZone.appendChild(fb);
      const b=el('button','btn big primary','开始重做');
      b.onclick=function(){fbZone.innerHTML=''; setPhase('answer');};
      actionRow.appendChild(b);
    } else if(p==='conflict'){
      const ansOK=isCorrect(), stampOK=(stampVal===q.annotation.tense);
      if(ansOK&&stampOK){ gradeNow(); return; }
      if(revised){ gradeNow(); return; }
      const note=el('div','note');
      let msg;
      if(!stampOK&&ansOK){msg='你的章盖的是「'+stampVal+'」，可句子像是「'+q.annotation.tense+'」——再看看橙色的标志词括号？';}
      else if(stampOK&&!ansOK){msg='章盖对了！但答案里好像有个小问题，再检查检查？';}
      else {msg='你的笔记和答案好像对不上哦——再想想？';}
      note.innerHTML='📝 <b>冲突自查</b><br>'+msg;
      const b1=el('button','btn primary','再想想，改一改');
      const b2=el('button','btn','就这样提交');
      b1.onclick=function(){
        note.remove(); revised=true; committed=false;
        setBanner('✍️ 改一改再交（<span class="hand">改这次就提交咯</span>）');
        ansZone.style.opacity='1';
        const btn=$('#commitBtn'); if(btn){btn.style.display='inline-block'; btn.disabled=false;}
        renderAnswerDisplay();
        /* 重设组句/填空可编辑 */
        document.querySelectorAll('.cardw').forEach(function(b){b.disabled=false;});
        placed=answer.value.slice();
        if(q.type==='build')renderSlots(); if(q.type==='fill')renderBlank();
      };
      b2.onclick=function(){note.remove(); gradeNow();};
      const bar=el('div','actionrow'); bar.appendChild(b1); bar.appendChild(b2);
      note.appendChild(bar);
      fbZone.appendChild(note);
    }
  }
  function advance(){ /* 标注/盖章完成后的推进 */
    const next=flow[phaseIdx+1];
    if(next==='grade'){gradeNow(); return;}
    if(next)setPhase(next);
  }

  /* 判分与反馈 */
  function starPop(){
    const s=el('div','bigstar','⭐');
    s.style.left=(30+Math.random()*40)+'%'; s.style.top='40%';
    card.appendChild(s); setTimeout(function(){s.remove();},1200);
  }
  function gradeNow(){
    if(graded)return; graded=true;
    state.seen[q.id]=true;
    const ok=isCorrect();
    palette.style.display='none'; stampRow.style.display='none';
    const fb=el('div','fb '+(ok?'ok':'bad'));
    if(ok){
      state.stars++; if(ctx.kind==='practice')session.starsEarned++;
      if(ctx.kind==='wrong'){delete state.wrong[q.id];}
      save(); refreshBadge(); starPop();
      fb.innerHTML='🌟 答对了！+1 ⭐';
      if(ctx.kind!=='practice'&&ctx.kind!=='quiz')fb.innerHTML+=' 做对即移出错题本！';
    } else {
      state.wrong[q.id]={mid:(session?session.mid:'T2'),tags:q.errorTags,explain:q.explain}; save();
      fb.innerHTML='❌ <span class="tag">'+q.errorTags[0]+'</span>'+(q.answer.fix?' 应该是：'+q.answer.fix:'')+'<br><span class="hintline">'+q.explain+'</span>';
    }
    fbZone.appendChild(fb);
    const bar=el('div','actionrow');
    if(!ok){
      const branch=branchForTag(q.errorTags[0],q.id.slice(0,2));
      const bm=el('button','btn','🗺 看导图（高亮「'+branch+'」）');
      bm.onclick=function(){highlightBranch(session?session.mid:q.id.slice(0,2),branch);};
      bar.appendChild(bm);
    }
    if(ctx.kind==='wrong'&&ok){
      const bw=el('button','btn big primary','✓ 返回错题本');
      bw.onclick=renderWrongbook; bar.appendChild(bw);
    } else if(ok||ctx.kind==='quiz'||ctx.kind==='practice'){
      const bn=el('button','btn big primary','下一题 →');
      let advanced=false;
      bn.onclick=function(){
        if(advanced)return; advanced=true;
        if(ctx.kind==='practice'){
          session.results.push({correct:ok,qid:q.id,tag:q.errorTags[0],explain:q.explain});
          nextPracticeQuestion();
        } else if(ctx.kind==='quiz'){
          session.results.push({correct:ok,qid:q.id,tag:q.errorTags[0],explain:q.explain});
          nextQuizQuestion();
        }
      };
      /* 答对后 1.4 秒自动下一题；若期间页面已翻走（按钮已不在页面上）则放弃，防止跳题 */
      if(ok&&(ctx.kind==='practice'||ctx.kind==='quiz'))setTimeout(function(){if(document.body.contains(bn))bn.click();},1400);
      bar.appendChild(bn);
    } else {
      const br=el('button','btn big primary','再试一次');
      br.onclick=function(){
        graded=false; committed=false; answer=null; placed=[]; fbZone.innerHTML='';
        stampDone=false; stampRow.style.display='none'; stampSlot.innerHTML='';
        if(q.type==='judge'||q.type==='choice'){chosenOpt=null; chosenJudge=null;}
        setPhase('answer');
      };
      bar.appendChild(br);
      const bk=el('button','btn','先回错题本'); bk.onclick=renderWrongbook; bar.appendChild(bk);
    }
    fbZone.appendChild(bar);
  }

  /* 组句题：句子区点击退词（在组句阶段） */
  slotEls.forEach(function(s,i){
    s.addEventListener('click',function(){
      if(currentPhase()!=='answer'||committed)return;
      if(placed[i]!==undefined){
        const c=placed.splice(i,1)[0];
        document.querySelectorAll('.cardw').forEach(function(b){if(b.dataset.card===c)b.disabled=false;});
        renderSlots(); const btn=$('#commitBtn'); if(btn)btn.disabled=(placed.length<q.cards.length);
      }
    });
  });

  function redraw(){ /* 卡片变化后重画括号（尺寸变了） */
    svg.innerHTML='';
    Object.keys(annotations).forEach(function(l){
      let els;
      if(isBuild){els=q.annotation[l].map(function(i){return slotEls[i];});}
      else{els=q.annotation[l].map(function(i){return words[i];});}
      drawBrace(box,svg,words,els,l,labelStyle(l).c,false);
    });
  }

  /* 启动 */
  setPhase(flow[0]);
  if(ctx.kind==='quiz'){ setBanner('🚀 小测：直接作答，看看真本事！'); }
  refreshBadge();
}

/* =============== 顶栏 =============== */
document.getElementById('homeBtn').onclick=renderLibrary;
document.getElementById('wrongBtn').onclick=renderWrongbook;
document.getElementById('soundBtn').onclick=function(){
  state.soundOn=!state.soundOn; save();
  this.textContent=state.soundOn?'🔊':'🔇';
  toast(state.soundOn?'语音已开（用浏览器发音）':'语音已关');
};
document.getElementById('resetBtn').onclick=function(){
  if(confirm('重置所有进度（星星/已掌握/错题本）？')){
    state={stars:0,mastered:{},seen:{},wrong:{},firstPracticeDone:{},soundOn:state.soundOn};
    save(); refreshBadge(); renderLibrary(); toast('已重置');
  }
};
document.getElementById('soundBtn').textContent=state.soundOn?'🔊':'🔇';

/* =============== 启动 =============== */
refreshBadge();
renderLibrary();

</script>
