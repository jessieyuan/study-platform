<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>许愿星预览</title>
<style>
body {
  background: linear-gradient(180deg, #fff9e6, #fef3d0);
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
  display: flex; flex-direction: column; align-items: center;
  padding: 40px 20px; color: #5c4a2e; min-height: 100vh;
}
h1 { font-size: 22px; margin-bottom: 4px; }
.desc { font-size: 13px; color: #b8a080; margin-bottom: 30px; }
.level-row { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; margin-bottom: 30px; }
.level-card {
  background: #fff; border-radius: 16px; padding: 20px;
  box-shadow: 0 4px 20px rgba(180,130,20,0.08);
  text-align: center; width: 130px;
}
.level-name { font-size: 15px; font-weight: 700; margin: 8px 0 2px; }
.level-req { font-size: 11px; color: #b8a080; }

@keyframes rainbowShift {
  0% { filter: hue-rotate(0deg) brightness(1.1); }
  100% { filter: hue-rotate(360deg) brightness(1.1); }
}
@keyframes sparkle {
  0%,100% { opacity: 0; transform: scale(0.3); }
  50% { opacity: 1; transform: scale(1); }
}
.rainbow-star { animation: rainbowShift 3s linear infinite; transform-origin: center; }
.sparkle-1 { animation: sparkle 1.5s ease-in-out infinite; }
.sparkle-2 { animation: sparkle 1.5s ease-in-out 0.5s infinite; }
.sparkle-3 { animation: sparkle 1.5s ease-in-out 1s infinite; }

.bottle-row { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
.bottle-card { text-align: center; }
.bottle-card .bottle-count { display: flex; align-items: center; justify-content: center; gap: 4px; margin-top: 6px; }
.bottle-card .bottle-count svg { width: 16px; height: 16px; }
.bottle-card .bottle-count span { font-size: 13px; font-weight: 600; color: #8a6d2e; }
</style>
</head>
<body>

<h1>许愿星等级预览</h1>
<div class="desc">每完成当天全部任务获得1颗，每30颗自动合并升级颜色</div>

<div class="level-row" id="levels"></div>

<h1 style="margin-top:20px;">瓶子效果预览</h1>
<div class="desc">瓶内星星数量与显示一致</div>

<div class="bottle-row" id="bottles"></div>

<script>
var STAR_LEVELS = [
  { name: '金星', color: '#f5c842' },
  { name: '红星', color: '#e85555' },
  { name: '蓝星', color: '#5ba4cf' },
  { name: '绿星', color: '#7bc043' },
  { name: '粉紫星', color: '#c77fd0' },
  { name: '彩虹星', color: 'rainbow' },
];
var STAR_PATH = 'M0,-12 L2.9,-4 L11.4,-3.7 L4.6,1.4 L7.1,9.7 L0,4.8 L-7.1,9.7 L-4.6,1.4 L-11.4,-3.7 L-2.9,-4 Z';

function makeStar(color, size) {
  size = size || 56;
  var isRainbow = color === 'rainbow';
  var fill = isRainbow ? 'url(#rainbow-grad)' : color;
  var cls = isRainbow ? 'rainbow-star' : '';
  var stroke = isRainbow ? '#fff' : color;
  var sparkles = isRainbow ?
    '<text class="sparkle-1" x="-8" y="-10" font-size="10">✨</text>' +
    '<text class="sparkle-2" x="6" y="8" font-size="8">✨</text>' +
    '<text class="sparkle-3" x="-4" y="10" font-size="6">✨</text>' : '';
  var defs = isRainbow ?
    '<defs><linearGradient id="rainbow-grad" x1="0" y1="0" x2="1" y2="1">' +
    '<stop offset="0%" stop-color="#ff6b6b"/><stop offset="20%" stop-color="#f5a623"/>' +
    '<stop offset="40%" stop-color="#7bc043"/><stop offset="60%" stop-color="#5ba4cf"/>' +
    '<stop offset="80%" stop-color="#c77fd0"/><stop offset="100%" stop-color="#ff6b6b"/></linearGradient></defs>' : '';
  // 立体效果：主面 + 左下暗面 + 高光
  return '<svg viewBox="-13 -13 26 26" width="' + size + '" height="' + size + '">' + defs +
    '<g class="' + cls + '">' +
    // 暗面（左下偏移）
    '<path d="' + STAR_PATH + '" fill="' + (isRainbow ? 'url(#rainbow-grad)' : color) + '" fill-opacity="0.4" transform="translate(0.8,0.8)"/>' +
    // 主面
    '<path d="' + STAR_PATH + '" fill="' + fill + '" fill-opacity="0.85" stroke="' + stroke + '" stroke-width="1.5" stroke-linejoin="round"/>' +
    // 高光面（右上）
    '<path d="M0,-12 L2.9,-4 L11.4,-3.7 L4.6,1.4" fill="rgba(255,255,255,0.35)" stroke="none"/>' +
    '</g>' + sparkles + '</svg>';
}

function makeSmallStar(color) {
  var isRainbow = color === 'rainbow';
  var fill = isRainbow ? 'url(#rb-small)' : color;
  var defs = isRainbow ?
    '<defs><linearGradient id="rb-small" x1="0" y1="0" x2="1" y2="1">' +
    '<stop offset="0%" stop-color="#ff6b6b"/><stop offset="20%" stop-color="#f5a623"/>' +
    '<stop offset="40%" stop-color="#7bc043"/><stop offset="60%" stop-color="#5ba4cf"/>' +
    '<stop offset="80%" stop-color="#c77fd0"/><stop offset="100%" stop-color="#ff6b6b"/></linearGradient></defs>' : '';
  return '<svg viewBox="-13 -13 26 26" width="16" height="16">' + defs +
    '<path d="' + STAR_PATH + '" fill="' + fill + '" fill-opacity="0.35" transform="translate(0.8,0.8)"/>' +
    '<path d="' + STAR_PATH + '" fill="' + fill + '" fill-opacity="0.85" stroke="' + (isRainbow ? 'rgba(255,255,255,0.8)' : color) + '" stroke-width="1.5" stroke-linejoin="round"/>' +
    '<path d="M0,-12 L2.9,-4 L11.4,-3.7 L4.6,1.4" fill="rgba(255,255,255,0.3)" stroke="none"/>' +
    '</svg>';
}

function makeBottle(color, count) {
  var isRainbow = color === 'rainbow';
  // 瓶子内部范围：底部Y约115，最宽处Y约78（x:8-92），底部窄（x:22-78）
  // 错落叠放位置，确保在瓶内可见
  var positions = [];
  for (var i = 0; i < count; i++) {
    var layer = Math.floor(i / 4);
    var inLayer = i % 4;
    // 水平：在25-75范围内错落
    var px = 28 + inLayer * 15 + (Math.sin(i * 2.3) * 3);
    // 垂直：从底部108往上堆，每层11
    var py = 108 - layer * 12 - (Math.cos(i * 1.7) * 2);
    // 确保不超出瓶底
    if (py < 40) py = 40;
    positions.push([px, py]);
  }
  var stars = '';
  for (var i = 0; i < count; i++) {
    var p = positions[i];
    var gid = 'st' + i + 'b' + count;
    var sFill = isRainbow ? 'url(#' + gid + ')' : color;
    var sDefs = isRainbow ?
      '<defs><linearGradient id="' + gid + '" x1="0" y1="0" x2="1" y2="1">' +
      '<stop offset="0%" stop-color="#ff6b6b"/><stop offset="20%" stop-color="#f5a623"/>' +
      '<stop offset="40%" stop-color="#7bc043"/><stop offset="60%" stop-color="#5ba4cf"/>' +
      '<stop offset="80%" stop-color="#c77fd0"/><stop offset="100%" stop-color="#ff6b6b"/></linearGradient></defs>' : '';
    stars += '<g' + (isRainbow ? ' class="rainbow-star" style="transform-origin:center;transform-box:fill-box"' : '') +
      ' transform="translate(' + p[0].toFixed(1) + ',' + p[1].toFixed(1) + ') scale(0.4)">' +
      sDefs +
      '<path d="' + STAR_PATH + '" fill="' + sFill + '" fill-opacity="0.35" transform="translate(0.8,0.8)"/>' +
      '<path d="' + STAR_PATH + '" fill="' + sFill + '" fill-opacity="0.85" stroke="' + (isRainbow ? 'rgba(255,255,255,0.8)' : color) + '" stroke-width="1.5" stroke-linejoin="round"/>' +
      '<path d="M0,-12 L2.9,-4 L11.4,-3.7 L4.6,1.4" fill="rgba(255,255,255,0.3)" stroke="none"/>' +
      '</g>';
  }
  var uid = 'bc' + count + '_' + Math.floor(Math.random()*100000);
  return '<svg viewBox="0 0 100 145" width="80" height="116">' +
    '<defs><clipPath id="' + uid + '"><path d="M30,30 C30,30 28,32 28,35 C16,42 6,58 6,78 C6,105 22,125 50,125 C78,125 94,105 94,78 C94,58 84,42 72,35 C72,32 70,30 70,30 Z"/></clipPath>' +
    '<linearGradient id="glass' + uid + '" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="rgba(255,255,255,0.3)"/><stop offset="100%" stop-color="rgba(240,235,220,0.12)"/></linearGradient></defs>' +
    '<g clip-path="url(#' + uid + ')">' + stars + '</g>' +
    '<path d="M30,30 C30,30 28,32 28,35 C16,42 6,58 6,78 C6,105 22,125 50,125 C78,125 94,105 94,78 C94,58 84,42 72,35 C72,32 70,30 70,30 Z" fill="url(#glass' + uid + ')" stroke="rgba(180,160,120,0.7)" stroke-width="2.5"/>' +
    '<path d="M22,42 C22,42 16,57 14,77 C12,92 16,110 22,118" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="4" stroke-linecap="round"/>' +
    '<rect x="28" y="24" width="44" height="8" rx="4" fill="rgba(255,255,255,0.2)" stroke="rgba(180,160,120,0.6)" stroke-width="1.5"/>' +
    '<rect x="33" y="10" width="34" height="16" rx="4" fill="#c49a6c" stroke="rgba(140,100,50,0.5)" stroke-width="1.2"/>' +
    '<line x1="40" y1="14" x2="40" y2="22" stroke="rgba(140,100,50,0.3)" stroke-width="0.8"/>' +
    '<line x1="50" y1="12" x2="50" y2="24" stroke="rgba(140,100,50,0.3)" stroke-width="0.8"/>' +
    '<line x1="60" y1="14" x2="60" y2="22" stroke="rgba(140,100,50,0.3)" stroke-width="0.8"/>' +
    '</svg>';
}

// Render level cards
var lvHtml = '';
var reqs = [0, 30, 60, 90, 120, 150];
for (var i = 0; i < STAR_LEVELS.length; i++) {
  var lv = STAR_LEVELS[i];
  lvHtml += '<div class="level-card">' +
    makeStar(lv.color, 56) +
    '<div class="level-name" style="color:' + (lv.color === 'rainbow' ? '#c77fd0' : lv.color) + '">' + lv.name + '</div>' +
    '<div class="level-req">Lv.' + (i+1) + (i === 0 ? ' · 初始' : ' · 累计' + reqs[i] + '颗') + '</div>' +
    '</div>';
}
document.getElementById('levels').innerHTML = lvHtml;

// Render bottles - show different counts
var demos = [
  { color: STAR_LEVELS[0].color, count: 3 },
  { color: STAR_LEVELS[0].color, count: 8 },
  { color: STAR_LEVELS[1].color, count: 5 },
  { color: STAR_LEVELS[2].color, count: 6 },
  { color: STAR_LEVELS[3].color, count: 4 },
  { color: STAR_LEVELS[4].color, count: 3 },
  { color: STAR_LEVELS[5].color, count: 2 },
];
var bHtml = '';
for (var i = 0; i < demos.length; i++) {
  var d = demos[i];
  bHtml += '<div class="bottle-card">' +
    makeBottle(d.color, i) +
    '<div class="bottle-count">' + makeSmallStar(d.color) + '<span>×' + d.count + '</span></div>' +
    '</div>';
}
document.getElementById('bottles').innerHTML = bHtml;
</script>
</body>
</html>
