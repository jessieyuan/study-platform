<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>许愿星预览</title>
<style>
body {
  background: linear-gradient(180deg, #fff9e6, #fef3d0);
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
  display: flex; flex-direction: column; align-items: center;
  padding: 40px 20px; color: #5c4a2e;
}
h1 { font-size: 22px; margin-bottom: 4px; }
.desc { font-size: 13px; color: #b8a080; margin-bottom: 30px; }
.level-row {
  display: flex; gap: 24px; flex-wrap: wrap; justify-content: center;
  margin-bottom: 20px;
}
.level-card {
  background: #fff; border-radius: 16px; padding: 20px;
  box-shadow: 0 4px 20px rgba(180,130,20,0.08);
  text-align: center; width: 140px;
}
.level-card h3 { font-size: 14px; margin-bottom: 12px; }
.level-card .star-demo svg { display: block; margin: 0 auto; }
.level-card .note { font-size: 12px; color: #b8a080; margin-top: 8px; }
.level-name { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
.level-req { font-size: 11px; color: #b8a080; }

/* 彩色闪光星星 */
@keyframes rainbowShift {
  0% { filter: hue-rotate(0deg) brightness(1.1); }
  100% { filter: hue-rotate(360deg) brightness(1.1); }
}
@keyframes sparkle {
  0%,100% { opacity: 0; transform: scale(0.5); }
  50% { opacity: 1; transform: scale(1); }
}
.rainbow-star { animation: rainbowShift 3s linear infinite; }
.sparkle-1 { animation: sparkle 1.5s ease-in-out infinite; }
.sparkle-2 { animation: sparkle 1.5s ease-in-out 0.5s infinite; }
.sparkle-3 { animation: sparkle 1.5s ease-in-out 1s infinite; }

/* 瓶子样式 */
.bottle-demo { margin-top: 30px; }
.bottle-row { display: flex; gap: 30px; flex-wrap: wrap; justify-content: center; }
.bottle-card { text-align: center; }
.bottle-card .bottle-name { font-size: 13px; margin-top: 8px; color: #8a6d2e; }
</style>
</head>
<body>

<h1>许愿星等级预览</h1>
<div class="desc">每完成当天全部任务获得1颗，每30颗自动合并升级颜色</div>

<div class="level-row" id="levels"></div>

<h1 style="margin-top:20px;">瓶子效果预览</h1>
<div class="bottle-demo">
  <div class="bottle-row" id="bottles"></div>
</div>

<script>
var STAR_LEVELS = [
  { name: '金星', color: '#f5c842' },
  { name: '红星', color: '#e85555' },
  { name: '蓝星', color: '#5ba4cf' },
  { name: '绿星', color: '#7bc043' },
  { name: '粉紫星', color: '#c77fd0' },
  { name: '彩虹星', color: 'rainbow' },
];
var STAR_PATH = 'M0,-10 L2.4,-3.3 L9.5,-3.1 L3.8,1.2 L5.9,8.1 L0,4 L-5.9,8.1 L-3.8,1.2 L-9.5,-3.1 L-2.4,-3.3 Z';

function makeStar(color, size) {
  size = size || 40;
  var isRainbow = color === 'rainbow';
  var fill = isRainbow ? 'url(#rainbow-grad)' : color;
  var cls = isRainbow ? 'rainbow-star' : '';
  var sparkles = isRainbow ? 
    '<text class="sparkle-1" x="-6" y="-8" font-size="8">✨</text>' +
    '<text class="sparkle-2" x="5" y="6" font-size="6">✨</text>' +
    '<text class="sparkle-3" x="-3" y="8" font-size="5">✨</text>' : '';
  var defs = isRainbow ?
    '<defs><linearGradient id="rainbow-grad" x1="0" y1="0" x2="1" y2="1">' +
    '<stop offset="0%" stop-color="#ff6b6b"/><stop offset="25%" stop-color="#f5a623"/>' +
    '<stop offset="50%" stop-color="#7bc043"/><stop offset="75%" stop-color="#5ba4cf"/>' +
    '<stop offset="100%" stop-color="#c77fd0"/></linearGradient></defs>' : '';
  return '<svg viewBox="-12 -12 24 24" width="' + size + '" height="' + size + '">' +
    defs + '<g class="' + cls + '">' +
    '<path d="' + STAR_PATH + '" fill="' + fill + '" fill-opacity="0.8" stroke="' + (isRainbow ? '#fff' : color) + '" stroke-width="1.5" stroke-linejoin="round"/>' +
    '<path d="M0,-7 L1.5,-2.5 L3.5,-2.5" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1.5" stroke-linecap="round"/>' +
    '</g>' + sparkles + '</svg>';
}

function makeBottle(color, count) {
  var isRainbow = color === 'rainbow';
  var showCount = Math.min(count, 6);
  var positions = [[30,100],[55,95],[40,80],[25,85],[60,75],[45,95]];
  var stars = '';
  for (var i = 0; i < showCount; i++) {
    var p = positions[i];
    stars += '<g transform="translate(' + p[0] + ',' + p[1] + ') scale(0.4)">' +
      '<path d="' + STAR_PATH + '" fill="' + (isRainbow ? 'url(#rb' + count + ')' : color) + '" fill-opacity="0.7" stroke="' + (isRainbow ? '#fff' : color) + '" stroke-width="1.5" stroke-linejoin="round"/>' +
      '</g>';
  }
  var defs = isRainbow ?
    '<defs><linearGradient id="rb' + count + '" x1="0" y1="0" x2="1" y2="1">' +
    '<stop offset="0%" stop-color="#ff6b6b"/><stop offset="50%" stop-color="#7bc043"/>' +
    '<stop offset="100%" stop-color="#c77fd0"/></linearGradient></defs>' : '';
  var fillColor = isRainbow ? 'rgba(199,127,208,0.12)' : color;
  return '<svg viewBox="0 0 100 145" width="80" height="116">' + defs +
    '<defs><clipPath id="bc' + count + '"><path d="M30,30 C30,30 28,32 28,35 C16,42 6,58 6,78 C6,105 22,125 50,125 C78,125 94,105 94,78 C94,58 84,42 72,35 C72,32 70,30 70,30 Z"/></clipPath></defs>' +
    '<rect x="0" y="80" width="100" height="145" fill="' + fillColor + '" fill-opacity="0.12" clip-path="url(#bc' + count + ')"/>' +
    '<g clip-path="url(#bc' + count + ')">' + stars + '</g>' +
    '<path d="M30,30 C30,30 28,32 28,35 C16,42 6,58 6,78 C6,105 22,125 50,125 C78,125 94,105 94,78 C94,58 84,42 72,35 C72,32 70,30 70,30 Z" fill="rgba(255,255,255,0.12)" stroke="rgba(180,160,120,0.7)" stroke-width="2.5"/>' +
    '<rect x="28" y="24" width="44" height="8" rx="4" fill="rgba(255,255,255,0.2)" stroke="rgba(180,160,120,0.6)" stroke-width="1.5"/>' +
    '<rect x="33" y="10" width="34" height="16" rx="4" fill="#c49a6c" stroke="rgba(140,100,50,0.5)" stroke-width="1.2"/>' +
    '</svg>';
}

// Render level cards
var lvHtml = '';
var reqs = [0, 30, 60, 90, 120, 150];
for (var i = 0; i < STAR_LEVELS.length; i++) {
  var lv = STAR_LEVELS[i];
  lvHtml += '<div class="level-card">' +
    '<div class="star-demo">' + makeStar(lv.color, 44) + '</div>' +
    '<div class="level-name" style="color:' + (lv.color === 'rainbow' ? '#c77fd0' : lv.color) + '">' + lv.name + '</div>' +
    '<div class="level-req">Lv.' + (i+1) + (i === 0 ? ' · 初始' : ' · 累计' + reqs[i] + '颗') + '</div>' +
    '</div>';
}
document.getElementById('levels').innerHTML = lvHtml;

// Render bottles
var bHtml = '';
for (var i = 0; i < STAR_LEVELS.length; i++) {
  var lv = STAR_LEVELS[i];
  var demoCount = [5, 15, 8, 12, 6, 3][i];
  bHtml += '<div class="bottle-card">' +
    makeBottle(lv.color, i) +
    '<div class="bottle-name">' + lv.name + ' ×' + demoCount + '</div>' +
    '</div>';
}
document.getElementById('bottles').innerHTML = bHtml;
</script>
</body>
</html>
